            - `NOT_EQUALS`: Not equal to

            - `STARTS_WITH`: Begins with prefix

            - `ENDS_WITH`: Ends with suffix

            - `INCLUDES`: Contains substring

            - `ONE_OF`: Matches any value in array

            - `NOT_ONE_OF`: Does not match any value in array

            - `EXISTS`: Field has a value (not null)

            - `DOES_NOT_EXIST`: Field is null

            '
        values:
          type: array
          items:
            type: string
          description: Array of values for ONE_OF or NOT_ONE_OF operators
          example:
          - value1
          - value2
      example:
        operator: INCLUDES
        values:
        - search term
    LocationSearchResponse:
      type: object
      description: 'Response for location search requests.

        Note: Only active (non-deleted) locations are included in results.

        '
      required:
      - data
      - pagination
      - totalResults
      properties:
        data:
          type: array
          description: Search results - either flat rows or full location objects based on format parameter
          items:
            oneOf:
            - $ref: '#/components/schemas/LocationSearchRow'
            - $ref: '#/components/schemas/Location'
            discriminator:
              propertyName: object
              mapping:
                LOCATION_SEARCH_ROW: '#/components/schemas/LocationSearchRow'
                LOCATION: '#/components/schemas/Location'
        pagination:
          $ref: '#/components/schemas/SearchPaginationInfo'
        totalResults:
          type: integer
          description: Total number of matching results (excluding soft-deleted records)
          minimum: 0
    CustomerContactReference:
