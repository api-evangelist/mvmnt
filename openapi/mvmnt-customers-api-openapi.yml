          items:
            $ref: '#/components/schemas/CustomerTransportationMode'
          description: Matches any value in the array
        notIn:
          type: array
          items:
            $ref: '#/components/schemas/CustomerTransportationMode'
          description: Does not match any value in the array
        isNull:
          type: boolean
          description: Field is null (true) or not null (false)
