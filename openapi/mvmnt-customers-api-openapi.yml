          example: 50000
        creditUsageWarning:
          type: number
          format: float
          description: Credit usage warning threshold
          example: 40000
        freeCreditReq:
          type: number
          format: float
          description: Free credit requirement
          example: 5000
        defaultMode:
          $ref: '#/components/schemas/CustomerTransportationMode'
        defaultMargin:
          type: number
          format: float
          description: Default margin percentage (0-1, e.g., 0.15 for 15%)
