                  attributes:
                    content: Dun & Bradstreet number
                  children: []
                  type: text
                  annotations: []
                  slots: {}
                type: inline
                annotations: []
                slots: {}
              type: paragraph
              annotations: []
              slots: {}
        leadSource:
          type:
          - string
          - 'null'
          description: How this customer was acquired
          example: Referral
        dbaName:
          type:
          - string
          - 'null'
          description: Doing business as name
          example: Acme Corp DBA
        numberOfEmployees:
