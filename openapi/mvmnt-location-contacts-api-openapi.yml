          - 'null'
          format: float
          description: Credit usage warning threshold
          example: 40000
        freeCreditReq:
          type:
          - number
          - 'null'
          format: float
          description: Free credit requirement
          example: 5000
        defaultMode:
          anyOf:
          - $ref: '#/components/schemas/CustomerTransportationMode'
          - type: 'null'
          description: Default transportation mode
        defaultMargin:
          type:
