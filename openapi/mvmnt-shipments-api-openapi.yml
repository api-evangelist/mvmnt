          - string
          - 'null'
          maxLength: 512
          description: Client-defined reference ID if set
          example: ERP-USER-12345
        email:
          type: string
          format: email
          description: User's email address
          example: john.doe@example.com
        name:
          type:
          - string
          - 'null'
          description: User's full name
          example: John Doe
        phone:
          type:
          - string
          - 'null'
          description: User's phone number
          example: +1-555-123-4567
        phoneExt:
          type:
          - string
          - 'null'
          description: Phone extension
          example: '123'
        status:
          type: string
          description: User account status
          enum:
          - PENDING
          - ACTIVE
          - INACTIVE
          example: ACTIVE
        avatarId:
          type:
          - string
          - 'null'
          format: uuid
          description: Profile avatar document ID
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        createdAt:
          type: string
          format: date-time
          description: When the user was created
          example: '2025-01-15T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: When the user was last updated
          example: '2025-01-15T14:30:00Z'
        deletedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When the user was soft deleted (null if active)
          example: null
    ShipmentReferenceField:
      type: string
      enum:
      - BOL_NUMBER
      - PICKUP_NUMBER
      - DELIVERY_NUMBER
      - PURCHASE_ORDER_NUMBER
      - GENERAL_LEDGER_CODE
      - CUSTOMER_REFERENCE_NUMBER
      - PRO_NUMBER
      - ITEM_IDENTIFICATION
      - PART_NUMBER
      - ACCOUNT_NUMBER
      - CONSIGNEE_ACCOUNT_NUMBER
      - PICKUP_LOCATION_IDENTIFICATION
      - DELIVER_LOCATION_IDENTIFICATION
      - PRODUCT_IDENTIFICATION
      - OTHER_IDENTIFICATION
      - CONTAINER_NUMBER
      - MACROPOINT_REFERENCE_NUMBER
      - DROP_TRAILER_NUMBER
      - APPOINTMENT_NUMBER
      - MASTER_BILL_OF_LADING_NUMBER
      - HOUSE_BILL_OF_LADING_NUMBER
      - LOCATION_IDENTIFICATION
      - TENDER_METHOD
      - ROUTE_NUMBER
      - SHOW_DECORATOR_NAME
      - SHOW_BOOTH_NUMBER
      - CARE_OF
      - TENDER_ID
      - ORDER_NUMBER
      - SHOW_NAME
      - AES_ITN
      - FIRMS_CODE
      - IT_NUMBER
      - JOB_NUMBER
      - TMS_ID
      - MASTER_AIRWAYBILL_NUMBER
      - HOUSE_AIRWAYBILL_NUMBER
      - AMS_HOUSE_BILL_OF_LADING_NUMBER
      description: 'Reference field types for shipment tracking.


        Common field types:

        - `BOL_NUMBER`: Bill of Lading Number

        - `PRO_NUMBER`: PRO Number (carrier tracking number)

        - `PURCHASE_ORDER_NUMBER`: Purchase Order Number

        - `CUSTOMER_REFERENCE_NUMBER`: Customer Reference Number

        - `CONTAINER_NUMBER`: Container Number

        - `MASTER_BILL_OF_LADING_NUMBER`: Master Bill of Lading Number

        - `HOUSE_BILL_OF_LADING_NUMBER`: House Bill of Lading Number

        - `MASTER_AIRWAYBILL_NUMBER`: Master Airway Bill Number

        - `HOUSE_AIRWAYBILL_NUMBER`: House Airway Bill Number


        Additional field types:

        - `PICKUP_NUMBER`: Pickup Number

        - `DELIVERY_NUMBER`: Delivery Number

        - `GENERAL_LEDGER_CODE`: GL Code

        - `ITEM_IDENTIFICATION`: Item ID

        - `PART_NUMBER`: Part Number

        - `ACCOUNT_NUMBER`: Account Number

        - `CONSIGNEE_ACCOUNT_NUMBER`: Consignee Account Number

        - `PICKUP_LOCATION_IDENTIFICATION`: Pickup Location ID

        - `DELIVER_LOCATION_IDENTIFICATION`: Delivery Location ID

        - `PRODUCT_IDENTIFICATION`: Product ID

        - `OTHER_IDENTIFICATION`: Other ID

        - `MACROPOINT_REFERENCE_NUMBER`: MacroPoint Reference Number

        - `DROP_TRAILER_NUMBER`: Drop Trailer Number

        - `APPOINTMENT_NUMBER`: Appointment Number

        - `LOCATION_IDENTIFICATION`: Location ID

        - `TENDER_METHOD`: Tender Method

        - `ROUTE_NUMBER`: Route Number

        - `SHOW_DECORATOR_NAME`: Show Decorator Name

        - `SHOW_BOOTH_NUMBER`: Show Booth Number

        - `CARE_OF`: Care Of

        - `TENDER_ID`: EDI Tender ID

        - `ORDER_NUMBER`: Order Number

        - `SHOW_NAME`: Show Name

        - `AES_ITN`: AES ITN (Automated Export System Internal Transaction Number)

        - `FIRMS_CODE`: FIRMS Code (Facility Information and Resources Management System)

        - `IT_NUMBER`: IT Number (Immediate Transportation)

        - `JOB_NUMBER`: Job Number

        - `TMS_ID`: TMS ID

        - `AMS_HOUSE_BILL_OF_LADING_NUMBER`: AMS House Bill of Lading Number

        '
    ShipmentTrackRequest:
      type: object
      required:
      - searches
      properties:
        searches:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ShipmentTrackSearch'
          description: 'Array of search queries. Results are returned in the same order as the input searches.

            Maximum 100 searches per request.

            '
        referenceFields:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentReferenceField'
          description: 'Optional filter for reference field types to search.

            If omitted, searches all reference field types.


            Common use: limit search to specific field types for faster results

            or to avoid false matches across different reference types.

            '
          example:
          - MASTER_AIRWAYBILL_NUMBER
          - BOL_NUMBER
          - PRO_NUMBER
      example:
        searches:
        - query: MAWB123456
        - query: BOL789
        referenceFields:
        - MASTER_AIRWAYBILL_NUMBER
        - BOL_NUMBER
    CarrierReference:
      type: object
      description: 'Enhanced reference to a carrier resource (returned in responses).

        Includes full carrier details in addition to id/key.


        Note: Does NOT include nested references (contacts, etc.) to prevent recursion.

