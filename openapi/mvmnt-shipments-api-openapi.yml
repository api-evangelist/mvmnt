            - message
            properties:
              field:
                type: string
                description: Field name that failed validation
              message:
                type: string
                description: Validation error message
    ShipmentLifecycleStatus:
      type: string
      enum:
      - DRAFT
      - TENDER_PENDING
      - ON_HOLD
      - PLANNING
      - SELECTED
      - BOOKED
      - DISPATCHED
      - LOADING
      - PICKED_UP
      - IN_TRANSIT
      - UNLOADING
      - ARRIVED_AT_DELIVERY_TERMINAL
      - OUT_FOR_DELIVERY
      - RECOVERED
      - DELIVERED
      - CANCELED
      - TENDER_REJECTED
      description: 'Current status of the shipment lifecycle.


        **Pre-transit:**

        - `DRAFT`: Shipment being created

        - `TENDER_PENDING`: Awaiting carrier tender acceptance

        - `TENDER_REJECTED`: Carrier rejected the tender

        - `ON_HOLD`: Shipment temporarily paused

        - `PLANNING`: Being planned/scheduled

        - `SELECTED`: Carrier selected

        - `BOOKED`: Carrier confirmed booking

        - `DISPATCHED`: Dispatched to carrier


        **In-transit:**

        - `LOADING`: Loading at pickup

        - `PICKED_UP`: Picked up

        - `IN_TRANSIT`: In transit

        - `UNLOADING`: Unloading at delivery

        - `ARRIVED_AT_DELIVERY_TERMINAL`: At delivery terminal (LTL)

        - `OUT_FOR_DELIVERY`: Out for final delivery

        - `RECOVERED`: Shipment has been recovered


        **Final:**

        - `DELIVERED`: Delivered

        - `CANCELED`: Canceled

        '
    PaginationInfo:
      type: object
      required:
      - pageSize
      - hasNextPage
      properties:
        pageSize:
          type: integer
          description: Number of items per page
          example: 50
        hasNextPage:
          type: boolean
          description: Whether there are more pages
          example: true
        hasPreviousPage:
          type: boolean
          description: Whether there are previous pages
          example: false
        endCursor:
          type:
          - string
          - 'null'
          description: Cursor for the next page (null if no next page)
          example: eyJpZCI6IjU1MGU4NDAwLWUyOWItNDFkNC1hNzE2LTQ0NjY1NTQ0MDAwMCJ9
    ShipmentFilterRequest:
      type: object
