        paymentTermName:
          $ref: '#/components/schemas/KeywordSearchCriteria'
        creditLimit:
          $ref: '#/components/schemas/FloatSearchCriteria'
        outstandingBalance:
          $ref: '#/components/schemas/FloatSearchCriteria'
        totalRevenue:
          $ref: '#/components/schemas/FloatSearchCriteria'
        totalTransportationCost:
          $ref: '#/components/schemas/FloatSearchCriteria'
        totalGrossProfit:
