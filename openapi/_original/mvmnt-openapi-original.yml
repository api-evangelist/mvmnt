openapi: 3.1.0
info:
  title: MVMNT API
  version: 1.0.0
  description: >
    The MVMNT API enables you to automate freight brokerage workflows by
    integrating

    directly with our Transportation Management System.


    ## Authentication


    OAuth 2.0 client credentials flow. See [Authentication
    Guide](/getting-started/authentication)

    for details.


    ### Token Endpoint


    ```

    POST https://api.mvmnt.io/oauth2/token

    ```


    #### Request


    **Headers:**

    ```http

    Content-Type: application/x-www-form-urlencoded

    ```


    **Body Parameters:**

    ```

    grant_type=client_credentials

    client_id=YOUR_CLIENT_ID

    client_secret=YOUR_CLIENT_SECRET

    ```


    #### Example Request


    ```bash

    curl -X POST https://api.mvmnt.io/oauth2/token \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -d "grant_type=client_credentials" \
      -d "client_id=YOUR_CLIENT_ID" \
      -d "client_secret=YOUR_CLIENT_SECRET"
    ```


    #### Success Response


    **Status:** `200 OK`


    ```json

    {
      "access_token": "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...",
      "token_type": "Bearer",
      "expires_in": 3600
    }

    ```


    **Response Fields:**

    - `access_token`: JWT Bearer token to use for API requests

    - `token_type`: Always `Bearer`

    - `expires_in`: Token lifetime in seconds (3600 = 1 hour)
