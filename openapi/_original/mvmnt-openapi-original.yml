        - `NOT_READY_TO_INVOICE`: Not ready to invoice
        - `READY_TO_INVOICE`: Ready to generate invoice
        - `INVOICED`: Invoice generated and sent
        - `PARTIALLY_PAID`: Partial payment received
        - `PAID`: Fully paid
