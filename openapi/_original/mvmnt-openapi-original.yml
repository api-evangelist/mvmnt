        quotesWon:
          $ref: '#/components/schemas/IntSearchCriteria'
        quoteWinRate:
          $ref: '#/components/schemas/FloatSearchCriteria'
          description: Computed win rate (quotesWon / quotesCount)
        mostRecentOrderCreationAt:
