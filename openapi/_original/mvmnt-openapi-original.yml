webhooks:
  your-endpoint:
    post:
      summary: Webhook Event
      description: >
        All webhook events are delivered to your configured endpoint URL.


        The `event` field in the payload determines which type of webhook was
        triggered.

        Your endpoint should handle all event types or gracefully ignore unknown
        events.


        **Event Types:**

        - Entity changes: `CUSTOMER_*`, `COMPANY_*`, `CARRIER_*`,
        `CUSTOMER_CONTACT_*`

        - Shipment events: `SHIPMENT_DELIVERED`, `SHIPMENT_BOOKED`,
        `SHIPMENT_DISPATCHED`, etc.

        - Financial events: `CARRIER_INVOICE_CREATED`,
        `CUSTOMER_PAYMENT_CREATED`, etc.


        **Security:** All webhook requests include an `x-api-key` header
        containing your webhook token configured in the MVMNT UI.


        **Best Practices:**

        - Return 200 OK quickly and process asynchronously

        - Implement idempotency using event ID and timestamp

        - Handle unknown event types gracefully for forward compatibility
      operationId: webhookCallback
      tags:
        - Event Notifications
