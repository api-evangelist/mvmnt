            - 'null'
          description: Motor Carrier (MC) number
          example: MC-123456
        dotNumber:
          type:
            - string
            - 'null'
          description: Department of Transportation (DOT) number
          example: '1234567'
        scac:
          type:
            - string
            - 'null'
          description: Standard Carrier Alpha Code
          example: SWFT
