          $ref: '#/components/schemas/CarrierFilter'
          description: >
            Filter criteria (optional - omit to return all carriers).


            Note: deletedAt automatically defaults to { isNull: true } unless
            explicitly overridden.
        pageSize:
          type: integer
          minimum: 1
          maximum: 250
          default: 50
          description: Number of results per page
