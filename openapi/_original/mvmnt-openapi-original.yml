        - $ref: '#/components/parameters/IdOrClientKey'
        - $ref: '#/components/parameters/LookupBy'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePatch'
            examples:
              updateSchedule:
                summary: Update scheduled date
                value:
                  scheduledDate: '2025-01-22'
