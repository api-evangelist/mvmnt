        - type: object
          properties:
            event:
              type: string
              enum:
                - CARRIER_PAYMENT_METHOD_CREATED
                - CARRIER_PAYMENT_METHOD_UPDATED
                - CARRIER_PAYMENT_METHOD_DELETED
            data:
              $ref: '#/components/schemas/CarrierPaymentMethod'
    VendorPaymentMethodChangedPayload:
      allOf:
