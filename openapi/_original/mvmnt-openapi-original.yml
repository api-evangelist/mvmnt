            $ref: '#/components/schemas/BillStatus'
        notIn:
          type: array
          items:
            $ref: '#/components/schemas/BillStatus'
    BillEntityTypeFilter:
      type: object
      properties:
        equalTo:
          $ref: '#/components/schemas/BillEntityType'
        in:
          type: array
          items:
            $ref: '#/components/schemas/BillEntityType'
    BillPaymentMethodTypeFilter:
      type: object
      properties:
        equalTo:
          $ref: '#/components/schemas/BillPaymentMethodType'
        in:
          type: array
          items:
            $ref: '#/components/schemas/BillPaymentMethodType'
    bill-payments_CarrierFactorReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyName:
          type: string
        bankName:
          type:
            - string
            - 'null'
    BillPaymentApplicationPatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Existing application ID (for update)
        billId:
          type: string
          format: uuid
          description: Bill ID (for new applications)
        amount:
          type: number
          minimum: 0.01
        delete:
          type: boolean
          description: Set to true to remove this application
    CarrierContactChangedPayload:
      allOf:
        - $ref: '#/components/schemas/WebhookPayload'
        - type: object
          properties:
            event:
              type: string
              enum:
                - CARRIER_CONTACT_CREATED
                - CARRIER_CONTACT_UPDATED
                - CARRIER_CONTACT_DELETED
            data:
              $ref: '#/components/schemas/CarrierContact'
    CarrierFactorChangedPayload:
      allOf:
