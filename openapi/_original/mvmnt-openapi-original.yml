          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutstandingBillsForPaymentResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /carrier-factors/{id}/bills-for-payment:
    get:
      summary: Get bills payable to a carrier factor
      description: >
        List bills that should be paid to this carrier factor.


        Returns bills from carriers that use this factor with status
        `APPROVED_TO_PAY`.
      operationId: getCarrierFactorBillsForPayment
      tags:
        - Carrier Factors
      parameters:
        - $ref: '#/components/parameters/IdOrClientKey'
        - $ref: '#/components/parameters/LookupBy'
      responses:
        '200':
          description: Bills for payment retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutstandingBillsForPaymentResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /bill-payments/{id}/remittance-advice:
    get:
      summary: Generate remittance advice
      description: |
        Generate a remittance advice document for a bill payment.

        ## Formats

        - PDF (default): Set Accept header to application/pdf
        - JSON: Set Accept header to application/json
      operationId: getBillPaymentRemittanceAdvice
      tags:
        - Bill Payments
