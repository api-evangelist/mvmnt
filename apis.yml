aid: mvmnt
name: MVMNT
description: >-
  MVMNT is a freight-brokerage transportation management system (TMS) for midmarket and small
  freight brokers and shippers. Its REST API (OpenAPI 3.1) and real-time webhooks let teams
  automate freight workflows end to end: managing customers, carriers, companies, loads,
  shipments, and quotes, and running accounts-receivable/accounts-payable finance (invoices,
  bills, payments, credit memos) so the MVMNT TMS stays in sync with internal systems. The API
  uses OAuth 2.0 client-credentials auth, cursor pagination, PATCH partial updates, soft deletes,
  and a webhook event catalog covering entity, shipment, and financial events.
